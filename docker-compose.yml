
services:
  # 1. Database Container
  database:
    image: postgres:17
    container_name: qcapp-database
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  # 2. Backend / API Container
  backend:
    image: node:20
    container_name: qcapp-backend
    working_dir: /app
    volumes:
      - ./:/app
    command: >
      sh -c "npm install -g pnpm@9 &&
      pnpm config set ignore-scripts false &&
      pnpm install --no-frozen-lockfile &&
      pnpm rebuild bcrypt &&
      pnpm run api:dev"
    ports:
      - "3000:3000"
    environment:
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_DATABASE: ${DB_DATABASE}
      API_PORT: ${API_PORT}
    depends_on:
      - database
    restart: always

  # 3. Frontend / Web Portal Container
  frontend:
    image: node:20
    container_name: qcapp-frontend
    working_dir: /app
    volumes:
      - ./:/app
    command: >
      sh -c "npm install -g pnpm@9 &&
      pnpm install --no-frozen-lockfile &&
      pnpm --filter @qc/web build &&
      pnpm --filter @qc/web start"
    ports:
      - "127.0.0.1:3001:3001"
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
      API_INTERNAL_URL: ${API_INTERNAL_URL}
    depends_on:
      - backend
    restart: always

volumes:
  postgres_data:
    external: true
    name: 7ce04049d0c24d649d93fbcd41285819d419d2d0fbe74cc03ae869d7725d4e00
